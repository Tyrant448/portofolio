<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101014">
  <title>Portofolio | Nama Anda</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101014;
      color: #f5f5f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 35%, rgb(111 76 255 / 14%), transparent 45%),
        #101014;
    }

    .card {
      width: min(100%, 420px);
      padding: 48px 32px 36px;
      text-align: center;
      background: rgb(25 25 31 / 88%);
      border: 1px solid #303039;
      border-radius: 24px;
      box-shadow: 0 24px 80px rgb(0 0 0 / 35%);
    }

    .avatar {
      width: 132px;
      height: 132px;
      margin: 0 auto 24px;
      display: block;
      object-fit: cover;
      border: 4px solid #8b72ff;
      border-radius: 50%;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #a99aff;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 7vw, 2.4rem);
      letter-spacing: -0.04em;
    }

    .bio {
      margin: 12px 0 28px;
      color: #aaaab5;
      line-height: 1.7;
    }

    .social-links {
      display: grid;
      gap: 12px;
    }

    .social-links a {
      padding: 13px 18px;
      color: #f5f5f7;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      background: #24242d;
      border: 1px solid #383843;
      border-radius: 12px;
      transition: background-color 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .social-links a:hover {
      background: #302b49;
      border-color: #8b72ff;
      transform: translateY(-2px);
    }

    .social-links a:focus-visible {
      outline: 2px solid #a99aff;
      outline-offset: 3px;
    }

    .footer {
      margin: 28px 0 0;
      color: #777783;
      font-size: 0.8rem;
    }

    @media (max-width: 420px) {
      .card {
        padding: 40px 24px 30px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <img
      class="avatar"
      src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&h=400&q=85"
      alt="Foto profil Nama Anda"
    >
    <p class="eyebrow">Halo, saya</p>
    <h1>Tyrant</h1>
    <p class="bio">Entity from the 3rd Calendar Era, stranded in a Type-0.7 civilization. Currently experimenting with code, AI, and digital reality.</p>
    <nav class="social-links" aria-label="Media sosial">
      <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="https://github.com/" target="_blank" rel="noopener noreferrer">GitHub</a>
    </nav>

    <p class="footer">Terima kasih sudah berkunjung ✨</p>
  </main>
</body>
</html>
